<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domínio Descontinuado</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        h1 { color: #333; font-size: 28px; margin: 0 0 15px 0; }
        p { color: #666; font-size: 16px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Este Domínio Foi Descontinuado</h1>
        <p>O site mio-tokyo.com deixou de estar ativo.</p>
        <p>Se procura informações sobre este projeto, por favor contacte o proprietário.</p>
        <p>Este domínio está temporariamente indisponível e será removido do índice de pesquisa.</p>
    </div>
</body>
</html>
