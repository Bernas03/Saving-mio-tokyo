<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Closed</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 600px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin: 0 0 15px 0;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>This Store Has Been Closed</h1>

        <p>
            The store <strong>mio-tokyo.com</strong> has been closed by Shopify
            and is currently unavailable.
        </p>

        <p>
            Please visit <a href="https://emi-tokyo.com">emi-tokyo.com</a>
            to continue shopping.
        </p>
    </div>
</body>
</html>
