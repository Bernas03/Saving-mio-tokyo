name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build da loja
        run: pnpm run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production

      - name: Copiar CNAME
        run: cp CNAME dist/public/CNAME

      - name: Gerar páginas para as rotas da SPA
        working-directory: dist/public
        run: |
          cp index.html 404.html
          for page in コレクション 私たちについて お問い合わせ 配送追跡 利用規約 プライバシーポリシー 返金ポリシー 配送ポリシー 注文完了; do
            mkdir -p "$page"
            cp index.html "$page/index.html"
          done
          mkdir -p "商品"
          for id in bucket-bag-blue bucket-bag-brown bucket-bag-green bucket-bag-yellow; do
            mkdir -p "商品/$id"
            cp index.html "商品/$id/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4